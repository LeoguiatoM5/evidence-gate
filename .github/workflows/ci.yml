name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Generate the Prisma client
        run: npm run db:generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Check the bundled example
        run: npm run demo:healthy

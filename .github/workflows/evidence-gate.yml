name: Evidence Gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: Evaluate the change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate compares against the base branch, so the history is needed.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Generate the Prisma client
        run: npm run db:generate

      # This repository gates itself with its own tool.
      - uses: ./
        with:
          base: origin/${{ github.base_ref }}
          fail-on: blocked
